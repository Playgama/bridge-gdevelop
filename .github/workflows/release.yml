name: GitHub Release

# Creates a GitHub release with the extension file attached when a v2+ tag is pushed (v1.x tags are ignored).
# Release notes are auto-generated from commits and can be edited afterwards.

on:
  push:
    tags:
      - 'v[2-9].*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PlaygamaBridge.json --clobber
          else
            gh release create "$TAG" PlaygamaBridge.json --title "$TAG" --generate-notes --verify-tag
          fi
